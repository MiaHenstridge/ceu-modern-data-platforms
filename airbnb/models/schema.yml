models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings.
    columns:
      - name: listing_id
        description: The primary key for the listing.
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: The host's id. References the host table.
        data_tests:
          - not_null
          - relationships:    # foreign key test 
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: The type of room.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                         'Private room',
                         'Shared room',
                         'Hotel room']

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'


  - name: dim_hosts_cleansed
    description: Cleansed table which contains Airbnb hosts.
    columns:
      - name: host_id
        description: Primary key for the host.
        data_tests:
          - unique
          - not_null

      - name: host_name
        description: '{{ doc("dim_hosts_cleansed__host_name") }}'
        data_tests:
          - not_null

      - name: is_superhost
        description: Whether the host is a superhost.
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

  - name: fct_reviews
    columns:
      - name: review_id
        data_tests:
          - dbt_expectations.expect_column_to_exist
